[package]
name = "ironrdp-tokio"
version = "0.10.0"
readme = "README.md"
description = "`Framed*` traits implementation above Tokio’s traits"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false

[features]
default = []
reqwest = ["dep:reqwest", "dep:url"]
reqwest-rustls-ring = ["reqwest", "reqwest?/rustls-tls-webpki-roots"]
reqwest-native-tls = ["reqwest", "reqwest?/native-tls"]

[dependencies]
ironrdp-async = { path = "../ironrdp-async", version = "0.10" } # public
ironrdp-connector = { path = "../ironrdp-connector", version = "0.10" } # public
ironrdp-pdu = { path = "../ironrdp-pdu", version = "0.9" }
tokio = { version = "1", features = ["io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "system-proxy"], optional = true }
url = { version = "2.5", optional = true }

[dev-dependencies]
ironrdp-core = { path = "../ironrdp-core", version = "0.2" }
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
